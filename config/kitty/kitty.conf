# ── Miku 01 ♪ ──
font_family          JetBrainsMono Nerd Font
font_size            11.5
window_padding_width 12
background_opacity   0.92
cursor_shape         beam
cursor_trail         3
confirm_os_window_close 0
enable_audio_bell    no
remember_window_size no


# Miku/Teto colours last (mode-theme.conf -> miku-theme.conf or teto-theme.conf, switched by desktop-mode)
include mode-theme.conf
